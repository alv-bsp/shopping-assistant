<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosa mangiamo</title>
  <meta name="description" content="Menu della settimana, spesa e dispensa di casa">
  <meta name="theme-color" content="#f6f0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1613" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cosa mangiamo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sezioni"></nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="grabber" aria-hidden="true"></div>
      <button class="sheet-close icon-btn small" data-a="close-sheet" aria-label="Chiudi"></button>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
